<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pulse</title>
</head>
<body>
<a th:fragment="discord-bot-tile"
   th:if="${@environment.acceptsProfiles('discord')}"
   th:href="@{/discord/bot}" class="d-inline-block link-tile link-tile-discord-bot"
>
    <img src="#" th:src="@{/static/icon/logo/discord.svg}" alt="Discord Logo" class="logo">
    <div class="d-inline-flex flex-center-wrap-gap gap-tiny mb-0">
        <div>Bot</div>
        <div class="feature text-secondary">1v1 stats</div>
        <div class="feature text-secondary">Role management</div>
        <th:block th:with="installationData=${@discordAPI.getInstallationData().onErrorComplete().block()}">
            <th:block th:if="${installationData != null}">
                <div class="usage server text-secondary c-divider">
                    <span class="description">Used in</span>
                    <span th:text="${installationData.guildCount()}"></span> servers
                </div>
                <div class="usage user text-secondary c-divider">
                    <span class="description">Used by</span>
                    <span th:text="${installationData.userCount()}"></span> users
                </div>
            </th:block>
        </th:block>
    </div>
</a>
<a th:fragment="discord-server-tile" th:href="${@environment.getProperty('com.nephest.battlenet.sc2.contacts.discord.server')}" class="d-inline-block link-tile link-tile-discord-server">
    <img src="#" th:src="@{/static/icon/logo/discord.svg}" alt="Discord" class="logo">
    <div class="d-inline-flex flex-center-wrap-gap gap-tiny mb-0">
        <div>Server</div>
        <div class="feature text-secondary">Support</div>
        <div class="feature text-secondary">Feature requests</div>
    </div>
</a>
<a th:fragment="ad (ad, deviceType)"
   th:with="adLabel=${(ad.isSponsored() ? 'Sponsor: ' : 'Friend: ') + ad.name()}"
   th:href="${ad.url()}"
   target="_blank"
   th:rel="${ad.isSponsored() ? 'noopener sponsored' : 'noopener'}"
   th:title="${adLabel}"
   th:data-ad-name="${ad.name()}"
   class="ad-slot text-break d-inline-block mb-3 mx-2"
>
    <img th:src="@{|/static/icon/sponsor/${ad.imageFileNames.get(deviceType)}|}" th:alt="${adLabel}">
</a>
<th:block th:fragment="ad-mobile"
          th:with="mobileAd=${showAds == true
            ? @supporterService.getRandomAd(T(com.nephest.battlenet.sc2.model.ad.DeviceType).MOBILE).orElse(null)
            : null},
            mobileAdType=${T(com.nephest.battlenet.sc2.model.ad.DeviceType).MOBILE}"
>
    <div th:if="${mobileAd != null}" class="sponsor-mobile-container no-popup-hide">
        <a th:with="adLabel=${(mobileAd.isSponsored() ? 'Sponsor: ' : 'Friend: ') + mobileAd.name()}"
           th:href="${mobileAd.url()}"
           target="_blank"
           th:rel="${mobileAd.isSponsored() ? 'noopener nofollow sponsored' : 'noopener nofollow'}"
           th:title="${adLabel}"
           th:data-ad-name="${mobileAd.name()}"
           class="ad-slot mobile d-inline-block"
        >
            <img th:src="@{|/static/icon/sponsor/${mobileAd.imageFileNames.get(mobileAdType)}|}"
                 th:alt="${adLabel}"
                 width="320"
                 height="50">
        </a>
    </div>
</th:block>
<th:block th:fragment="header">
    <h1 class="text-dark no-popup-hide mt-3"><a th:href="@{/}"><img width="32" height="32" th:src="@{/static/icon/misc/pulse.svg}" class="mr-1" alt="Pulse"/><span> SC2 Pulse</span></a></h1>
    <th:block th:replace="~{fragments/misc :: ad-mobile}"></th:block>
</th:block>
</body>
</html>
